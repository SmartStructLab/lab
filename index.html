<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>构造创设研究室</title>
<script>
(async function(){
  try{
    const r=await fetch(
      'https://api.github.com/repos/SmartStructLab/lab/commits/main?t='+Date.now(),
      {cache:'no-store'}
    );
    const d=await r.json();
    const v=d.sha.substring(0,12);
    location.replace('site.html?v='+v);
  }catch(e){
    location.replace('site.html?t='+Date.now());
  }
})();
</script>
</head>
<body></body>
</html>
